# Local development database only. Production uses Neon (see docs/architecture.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: devlens
      POSTGRES_PASSWORD: devlens # local-only credential, never used in deployment
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
